
# Сколько последних постов парсить из каждого сообщества
posts_per_group: 15

sources_dir: "sources"
output_file: "events_output.json"

# Настройки пауз (переопределяются из .env)
ai_delay_between_requests: 3
ai_max_retries: 3
ai_retry_base_delay: 5
vk_delay_between_groups: 2

#ai_provider: "openrouter"
#ai_model: "google/gemini-2.0-flash-exp:free"


#ai_provider: "qwen"
#ai_model: "qwen-plus"


# AI провайдер (бесплатные варианты)
# - "groq"          → https://console.groq.com (Llama 3.1 8B/70B бесплатно)
# - "openrouter"    → https://openrouter.ai (много бесплатных моделей)
# - "ollama"        → http://localhost:11434 (локально)
ai_provider: "groq"

ai_model: "qwen/qwen3.8-27b"
#ai_model: "llama-3.3-70b-versatile"